<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Birthday Scene</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,700;6..12,800;6..12,900&display=swap" />
<style>
  /* Birthday Wheel — full OBS scene (Browser Source, Local file, 1920×1080).
     Generated by the rewards-menu builder: options, names and one-time/repeat come from CONFIG below.
     The wheel's middle is a transparent hole: put your VTube Studio source BELOW this one.
     Spin: right-click the source → Interact → Spin. Press Done once it's done.
     Optional: put Tambyon.ttf next to this file to use the Tambyon font. */
  @font-face { font-family: Tambyon; src: url("Tambyon.ttf") format("truetype"), url("https://iomaya.com/assets/Tambyon-CRQZLfzq.ttf") format("truetype"); font-display: swap; }
  :root {
    --bg: #fff0f5; --text: #5d5c61; --muted: #a09ea6;
    --blue: #b2e2f2; --blue-d: #a5c9d6; --blue-card: #dff1f8;
    --pink: #ffd3df; --pink-d: #f3b4c6; --pink-strong: #ff9fb8;
    --head: Tambyon, 'Nunito Sans', serif; --label: 'Nunito Sans', Avenir, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }

  #stage { position: absolute; left: 50%; top: 0; width: 1920px; height: 1080px; transform-origin: top center; transform: translateX(-50%); overflow: hidden; color: var(--text); font-family: var(--label); }

  /* Scene background (everything here gets the face hole cut out) */
  /* The face hole is cut with plain gradients (no CSS mask/filters: cheap for OBS to draw). */
  #bg { position: absolute; inset: 0; background: radial-gradient(circle 132px at 640px 545px, transparent 131.5px, var(--bg) 132px); }
  #bg .card { position: absolute; left: 118px; top: 22px; width: 1044px; height: 1046px; border-radius: 140px; background: radial-gradient(circle 132px at 522px 523px, transparent 131.5px, var(--blue-card) 132px); }
  #bg .blob { position: absolute; border-radius: 50%; }

  /* Preview-only marker for the hole */

  #wheelWrap { position: absolute; left: 140px; top: 45px; width: 1000px; height: 1000px; overflow: hidden; }
  #spinner { position: absolute; inset: 0; will-change: transform; transform: translateZ(0); }
  #wheel { width: 100%; height: 100%; display: block; }
  #wheel text { font-family: var(--label); font-weight: 900; fill: var(--text); user-select: none; }
  #wheel .slice { transition: opacity .3s; }
  #wheel.picked .slice:not(.win) { opacity: .45; }
  #wheel .win path { stroke: #fff; stroke-width: 12; }
  .slice-out { transition: opacity .45s !important; opacity: 0 !important; }
  .rimdot.a { fill: #ffb3c7; } .rimdot.b { fill: #9dd6ea; }
  #wheel.phase .rimdot.a { fill: #9dd6ea; } #wheel.phase .rimdot.b { fill: #ffb3c7; }
  #wheelWrap.landed { animation: thump .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes thump { 40% { transform: scale(1.035); } }

  /* Hub ring around the face (does not spin) */
  #hub { position: absolute; left: 640px; top: 545px; width: 330px; height: 330px; margin: -165px 0 0 -165px; border-radius: 50%; pointer-events: none;
    box-shadow: inset 0 0 0 30px #fff, inset 0 0 0 36px var(--blue), 0 8px 0 var(--blue-d), 0 18px 40px rgba(93,92,97,.18); transition: box-shadow .3s; }
  #hubBtn { pointer-events: auto; position: absolute; left: 50%; bottom: -32px; transform: translateX(-50%); padding: 20px 56px; border: 0; border-radius: 30px; cursor: pointer; white-space: nowrap;
    background: var(--blue); color: var(--text); font: 900 26px/1 var(--label); letter-spacing: .22em; text-transform: uppercase; box-shadow: 0 6px 0 var(--blue-d); transition: background .2s, box-shadow .2s, opacity .2s; }
  #hubBtn.done { background: var(--pink); box-shadow: 0 6px 0 var(--pink-d); }
  #hubBtn:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 var(--blue-d); }
  #hubBtn.done:active { box-shadow: 0 2px 0 var(--pink-d); }
  #stage.busy #hubBtn { opacity: 0; pointer-events: none; animation: none; }

  #pointer { position: absolute; left: 1090px; top: 501px; width: 112px; height: 94px; z-index: 3; }

  /* Right panel */
  #panel { position: absolute; left: 1218px; top: 60px; width: 652px; height: 960px; padding: 40px 44px 34px; border-radius: 48px; background: #fff; box-shadow: 0 10px 0 var(--pink), 0 30px 60px rgba(93,92,97,.12); display: flex; flex-direction: column; }
  #panel h1 { margin: 0; font: italic 400 84px/0.95 var(--head); color: var(--text); }
  #panel hr { border: 0; height: 2px; background: #f6e6ec; margin: 22px 0; }
  #mascot { position: absolute; right: -40px; top: -46px; width: 150px; transform: rotate(10deg); }
  #mascot2 { position: absolute; left: 92px; bottom: 34px; width: 170px; transform: rotate(-8deg); }

  #result { flex: 0 0 318px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 34px; background: var(--bg); padding: 20px 24px; }
  #result .text { font: italic 400 50px/1.05 var(--head); margin: 14px 0 16px; }
  #result .text .plus { display: block; font: 900 26px/1.2 var(--label); color: var(--pink-strong); font-style: normal; }
  #result .idle { font: italic 400 54px/1 var(--head); }
  #result .idle small { display: block; margin-top: 12px; font: 800 14px/1 var(--label); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); font-style: normal; }
  #result .suspense { font: italic 400 64px/1 var(--head); }
  @keyframes wobble { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.06); } }
  .pill { display: inline-block; padding: 9px 20px; border-radius: 25px; font: 900 13px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--text); }
  .pill.once { background: var(--pink); }
  .pill.repeat { background: var(--blue); }
  #result.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.8); opacity: .3; } }

  #legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 4px; }
  #legend .pill { font-size: 12px; }
  /* Tiny reset in the panel corner: first click asks "sure?", second click (within 3s) resets. */
  #miniReset { position: absolute; right: 26px; bottom: 16px; padding: 4px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 800 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; opacity: .45; cursor: pointer; }
  #miniReset:hover { opacity: 1; }
  #miniReset.armed { opacity: 1; background: var(--pink); color: var(--text); }
  #doneHead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; }
  #doneHead b { font: italic 400 34px/1 var(--head); font-weight: 400; }
  #doneHead span { font: 800 13px/1 var(--label); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  #doneList { list-style: none; margin: 10px 0 0; padding: 0; overflow: hidden; flex: 1; font: 700 19px/1.3 var(--label); }
  #doneList li { padding: 6px 0; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f6e6ec; }
  #doneList .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  #doneList .dot.once { background: #ffb3c7; } #doneList .dot.repeat { background: #9dd6ea; }
  #doneList .times { margin-left: auto; padding: 4px 10px; border-radius: 20px; background: var(--blue); font: 900 14px/1 var(--label); letter-spacing: .06em; }

  .confetti { position: absolute; z-index: 7; pointer-events: none; will-change: transform; }

</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="card"></div>
    <div class="blob" style="left:60px;top:780px;width:220px;height:220px;background:#ffe1ea"></div>
    <div class="blob" style="left:1080px;top:40px;width:160px;height:160px;background:#ffe1ea"></div>
  </div>

  <div id="wheelWrap"><div id="spinner"><svg id="wheel" viewBox="-500 -500 1000 1000"></svg></div></div>
  <svg id="pointer" viewBox="0 0 112 94"><path transform="translate(0 5)" d="M4 44 C 28 30, 50 8, 72 8 A 36 36 0 0 1 72 80 C 50 80, 28 58, 4 44 Z" fill="#a5c9d6" stroke="#a5c9d6" stroke-width="7" stroke-linejoin="round"/><path d="M4 44 C 28 30, 50 8, 72 8 A 36 36 0 0 1 72 80 C 50 80, 28 58, 4 44 Z" fill="#b2e2f2" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><circle cx="72" cy="44" r="12" fill="#fff"/></svg>
  <div id="hub"><button id="hubBtn" data-mode="spin">Spin</button></div>
  <img id="mascot2" src="https://iomaya.com/assets/choppy-LJRhH00i.png" alt="" />

  <div id="panel">
    <img id="mascot" src="https://iomaya.com/assets/hid-B8GI59eV.png" alt="" />
    <h1>Birthday Wheel</h1>
    <hr />
    <div id="result"></div>
    <div id="legend">
      <span class="pill once">one time only!</span>
      <span class="pill repeat">can come back for more</span>
    </div>
    <div id="doneHead"><b>done so far</b><span id="left"></span></div>
    <ul id="doneList"></ul>
    <button id="miniReset" title="Put every option back and clear the list">↺ reset</button>
  </div>
</div>


<script>
/*__CONFIG__*/const CONFIG = {"title":"Birthday Wheel","onceLabel":"one time only!","repeatLabel":"can come back for more","items":[]};/*__END_CONFIG__*/
const ITEMS = CONFIG.items; // { id, label (on the wheel), full (result text), type: "once" | "repeat", double?: spin twice }
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
document.querySelector("#panel h1").textContent = CONFIG.title;
document.querySelector("#legend .pill.once").textContent = CONFIG.onceLabel;
document.querySelector("#legend .pill.repeat").textContent = CONFIG.repeatLabel;

const COLORS = { once: ["#ffc6d5", "#ffb3c7"], repeat: ["#b2e2f2", "#9dd6ea"] };
const R = 452, INNER = 164; // slices form a ring; the middle stays open for the model

const KEY = "bday-scene-v2";
const state = { removed: [], done: [] };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
const known = new Set(ITEMS.map((it) => it.id));
state.removed = (state.removed || []).filter((id) => known.has(id));
state.done = (state.done || []).filter((id) => known.has(id));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const $ = (s) => document.querySelector(s);
const spinner = $("#spinner"), wheel = $("#wheel"), stage = $("#stage"), result = $("#result"), pointer = $("#pointer"), hub = $("#hub"), hubBtn = $("#hubBtn");
const setBtn = (mode) => { hubBtn.dataset.mode = mode; hubBtn.textContent = { spin: "Spin", done: "Done", double: "Spin twice" }[mode]; hubBtn.classList.toggle("done", mode === "done"); };
const typeOf = (it) => (it.type === "once" ? "once" : "repeat");
const doubleIds = () => ITEMS.filter((it) => it.double).map((it) => it.id);
const live = () => ITEMS.filter((it) => !state.removed.includes(it.id));
const pt = (deg, r) => { const a = (deg * Math.PI) / 180; return [r * Math.sin(a), -r * Math.cos(a)]; };
let rotation = 0, busy = false, combo = null, comboFrom = null, picks = null;

function render() {
  const items = live(), n = items.length, a = 360 / Math.max(n, 1);
  const fs = Math.max(18, Math.min(32, ((2 * Math.PI * 340) / Math.max(n, 1)) * 0.3));
  const count = { once: 0, repeat: 0 };
  let s = "";
  items.forEach((it, i) => {
    const t = typeOf(it), fill = COLORS[t][count[t]++ % 2];
    const [ox0, oy0] = pt(i * a, R), [ox1, oy1] = pt((i + 1) * a, R);
    const [ix0, iy0] = pt(i * a, INNER), [ix1, iy1] = pt((i + 1) * a, INNER);
    const big = a > 180 ? 1 : 0;
    const d = `M${ix0} ${iy0} L${ox0} ${oy0} A${R} ${R} 0 ${big} 1 ${ox1} ${oy1} L${ix1} ${iy1} A${INNER} ${INNER} 0 ${big} 0 ${ix0} ${iy0} Z`;
    const mid = (i + 0.5) * a;
    const label = `<text transform="rotate(-90)" x="${R - 28}" y="0" text-anchor="end" dominant-baseline="middle" font-size="${fs}">${esc(it.label)}</text>`;
    s += `<g class="slice" data-id="${it.id}"><path d="${d}" fill="${fill}" stroke="#fff" stroke-width="6"/><g transform="rotate(${mid})">${label}</g></g>`;
  });
  s += `<circle r="${R + 14}" fill="none" stroke="#fff" stroke-width="28"/>`;
  for (let k = 0; k < 48; k++) { const [x, y] = pt(k * 7.5, R + 14); s += `<circle class="rimdot ${k % 2 ? "a" : "b"}" cx="${x}" cy="${y}" r="6"/>`; }
  wheel.innerHTML = s;
  wheel.classList.remove("picked");
  spinner.style.transform = `rotate(${rotation}deg)`;

  $("#left").textContent = `${n} left`;
  const counts = new Map(); // insertion order = most recent first
  [...state.done].reverse().forEach((id) => counts.set(id, (counts.get(id) || 0) + 1));
  $("#doneList").innerHTML = [...counts].map(([id, c]) => {
    const it = ITEMS.find((x) => x.id === id);
    return `<li><i class="dot ${typeOf(it)}"></i><span>${esc(it.full)}</span>${c > 1 ? `<b class="times">×${c}</b>` : ""}</li>`;
  }).join("");
  if (!picks && !busy) { result.innerHTML = ""; setBtn("spin"); }
}


/* ── Spin: one smooth curve — gentle start, long even slow-down, stops. ── */
const POINTER = 90; // pointer sits at 3 o'clock
// Soft start (first 5%), then an even slow-down (power 2.2 ≈ friction).
const TAU = 0.05, N = 2.2;
const B_ = 1 / (Math.pow(1 - TAU, N - 1) * (1 + TAU * (N / 2 - 1))), A_ = (N * B_ * Math.pow(1 - TAU, N - 1)) / (2 * TAU);
const curve = (t) => (t < TAU ? A_ * t * t : 1 - B_ * Math.pow(1 - t, N));
const PEAK_V = N * B_ * Math.pow(1 - TAU, N - 1); // top speed, as a multiple of (distance / duration)

// How many frames per second this browser/OBS source actually shows.
const measureFps = () => new Promise((res) => {
  let n = 0, first = 0;
  const f = (t) => { if (!first) first = t; if (++n < 12) requestAnimationFrame(f); else res(Math.min(144, Math.max(24, (1000 * (n - 1)) / (t - first)))); };
  requestAnimationFrame(f);
});

async function spin(exclude = []) {
  const items = live(), pool = items.filter((it) => !exclude.includes(it.id));
  if (busy || !pool.length) return;
  busy = true; stage.classList.add("busy"); hub.classList.add("spinning");
  result.innerHTML = `<div class="idle">spinning…</div>`;
  const fps = await measureFps();
  const target = pool[Math.floor(Math.random() * pool.length)];
  const k = items.indexOf(target), a = 360 / items.length;
  const DUR = 9500;
  // Never move more than 1/3 of a slice per frame — beyond that the eye loses track and
  // the wheel seems to stutter or run backwards (the "wagon-wheel" effect).
  const maxDist = (a / 3) * (fps / 1000) * DUR / PEAK_V;
  const start = rotation;
  let end = POINTER - ((k + 0.5) * a + (Math.random() - 0.5) * a * 0.4);
  end += Math.ceil((start - end) / 360) * 360;
  end += 360 * Math.max(1, Math.min(6, Math.floor((maxDist - (end - start)) / 360)));
  const t0 = performance.now();
  let said = false;
  const frame = (now) => {
    const t = Math.min(1, (now - t0) / DUR);
    rotation = start + (end - start) * curve(t);
    spinner.style.transform = `rotate(${rotation}deg)`;
    if (!said && t > 0.75) { said = true; result.innerHTML = `<div class="suspense">and it's…</div>`; }
    if (t < 1) return requestAnimationFrame(frame);
    landed(target);
  };
  requestAnimationFrame(frame);
}

function landed(it) {
  busy = false; stage.classList.remove("busy"); hub.classList.remove("spinning");
  celebrate();
  const wrap = $("#wheelWrap"); wrap.classList.remove("landed"); void wrap.offsetWidth; wrap.classList.add("landed");
  wheel.classList.add("picked");
  wheel.querySelector(`.slice[data-id="${it.id}"]`)?.classList.add("win");
  if (combo) {
    combo.push(it);
    if (combo.length < 2) return setTimeout(() => { wheel.classList.remove("picked"); wheel.querySelector(".win")?.classList.remove("win"); spin([...doubleIds(), ...combo.map((p) => p.id)]); }, 1200);
    return show([...combo], "double trouble combo", true);
  }
  if (it.double) { comboFrom = it; return show([it], "ooh — double trouble", false, true); }
  show([it], "the wheel says");
}

function show(list, kicker, isCombo = false, isDouble = false) {
  picks = isCombo && comboFrom ? [...list, comboFrom] : list;
  result.innerHTML = `<div class="text">${list.map((p) => esc(p.full)).join('<span class="plus">+</span>')}</div>`;
  setBtn(isDouble ? "double" : "done");
  result.classList.remove("pop"); void result.offsetWidth; result.classList.add("pop");
}

hubBtn.addEventListener("click", () => {
  if (busy) return;
  const mode = hubBtn.dataset.mode;
  if (mode === "spin") return spin();
  if (mode === "double") { combo = []; picks = null; render(); return setTimeout(() => spin(doubleIds()), 300); }
  // done: log it; one-time options leave the wheel
  const list = picks; picks = null; combo = null; comboFrom = null;
  state.done.push(...list.filter((p) => !p.double || list.length === 1).map((p) => p.id));
  const gone = list.filter((p) => typeOf(p) === "once").map((p) => p.id);
  wheel.classList.remove("picked");
  gone.forEach((id) => wheel.querySelector(`.slice[data-id="${id}"]`)?.classList.add("slice-out"));
  setTimeout(() => { state.removed.push(...gone); save(); render(); }, gone.length ? 480 : 0);
});

/* Flash + confetti burst out of the wheel, then a gentle rain */
function celebrate() {
  const colors = ["#ff9fb8", "#b2e2f2", "#ffffff", "#ffd3df", "#8fd0e8"];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    const w = 10 + Math.random() * 10, h = i % 3 ? w * 1.6 : w;
    Object.assign(c.style, { left: "640px", top: "545px", width: w + "px", height: h + "px", background: colors[i % colors.length], borderRadius: i % 3 ? "3px" : "50%" });
    stage.appendChild(c);
    const ang = Math.random() * Math.PI * 2, dist = 300 + Math.random() * 520;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    c.animate([
      { transform: "translate(-50%,-50%) scale(.4) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: 0.35 },
      { transform: `translate(${dx * 1.1}px, ${dy + 700}px) rotate(${720 + Math.random() * 360}deg)`, opacity: 0 },
    ], { duration: 2600 + Math.random() * 1200, easing: "cubic-bezier(.15,.7,.3,1)" }).onfinish = () => c.remove();
  }
}

const resetAll = () => { state.removed = []; state.done = []; picks = null; combo = null; comboFrom = null; save(); render(); };
const mini = $("#miniReset"); let armTimer = null;
mini.addEventListener("click", () => {
  if (busy) return;
  if (!mini.classList.contains("armed")) {
    mini.classList.add("armed"); mini.textContent = "sure?";
    armTimer = setTimeout(() => { mini.classList.remove("armed"); mini.textContent = "↺ reset"; }, 3000);
    return;
  }
  clearTimeout(armTimer); mini.classList.remove("armed"); mini.textContent = "↺ reset";
  wheel.classList.remove("picked");
  resetAll();
});

function fit() { const s = Math.min(1, innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translateX(-50%) scale(${s})`; }
addEventListener("resize", fit); fit();
render();
</script>
</body>
</html>
